# YOLO dataset config for 52 playing cards.
# Paths are relative to this file. After running prepare_dataset, train/val images and labels
# will be in yolo_dataset/ and paths below will work.
path: .  # dataset root (data/cards when loading from project root as data/cards/cards.yaml)
train: yolo_dataset/train/images
val:   yolo_dataset/val/images

# 52 classes: 2h, 2d, 2c, 2s, ... Ah, Ad, Ac, As (must match CardDetector class IDs)
names:
  0: 2h
  1: 2d
  2: 2c
  3: 2s
  4: 3h
  5: 3d
  6: 3c
  7: 3s
  8: 4h
